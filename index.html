<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adega QDN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{background:#1d1d1d;padding:20px;text-align:center;border-bottom:2px solid #d4af37}
.profile{display:flex;flex-direction:column;align-items:center;gap:8px}
.profile img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:3px solid #d4af37}
.profile h1{margin:0;color:#d4af37}
.container{max-width:900px;margin:auto;padding:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.card{background:#202020;border-radius:14px;padding:15px;text-align:center;box-shadow:0 3px 10px #000}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#333}
.card h3{margin:10px 0 5px}
.price{color:#d4af37;font-size:20px;font-weight:bold}
button{border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer;font-weight:bold}
.adminBtn{background:#d4af37;color:#111}
.whatsapp{background:#25D366;color:white}
#admin{display:none;background:#1c1c1c;padding:20px;border-radius:15px;margin-top:25px}
input{width:100%;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #555;background:#111;color:white}
.adminProduct{background:#292929;padding:15px;margin:10px 0;border-radius:10px}
.delete{background:#b00020;color:white}
.save{background:#d4af37;color:#111}
.add{background:#444;color:white}
</style>
</head>

<body>

<header>
  <div class="profile">
    <img id="profileImage" src="https://via.placeholder.com/150">
    <h1 id="profileName">Adega QDN</h1>
    <button class="adminBtn" onclick="login()">🔐 Área do dono</button>
  </div>
</header>

<div class="container">

  <h2>🍻 Nossos produtos</h2>

  <div id="products" class="products">
    <p>Carregando produtos...</p>
  </div>

  <div id="admin">

    <h2>⚙️ Painel do dono</h2>

    <h3>Perfil</h3>

    <label>Nome</label>
    <input id="editName">

    <label>Foto do perfil (URL)</label>
    <input id="editImage">

    <button class="save" onclick="saveProfile()">
      💾 Salvar perfil
    </button>

    <hr>

    <h3>Produtos</h3>

    <div id="adminProducts"></div>

    <button class="add" onclick="addProduct()">
      ➕ Adicionar produto
    </button>

    <br>

    <button class="adminBtn" onclick="logout()">
      🔒 Sair do painel
    </button>

  </div>

</div>

<script>

/* =========================
   CONFIGURAÇÃO SUPABASE
========================= */

const SUPABASE_URL = "https://rvqajaippisabvfujigv.supabase.co";

const SUPABASE_KEY = "sb_publishable_wXVgSc7vxT3Z6_LBpQq--Q_cq4G-XCv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================
   SENHA DO DONO
========================= */

const SENHA = "QDN1234";

/* =========================
   DADOS
========================= */

let data = {
  profile:{
    name:"Adega QDN",
    image:"https://via.placeholder.com/150"
  },
  products:[]
};

/* =========================
   CARREGAR DADOS
========================= */

async function loadData(){

  try{

    const { data: perfil, error: perfilError } =
      await db
        .from("perfil")
        .select("*")
        .eq("id",1)
        .maybeSingle();

    if(perfilError){
      console.error("Erro no perfil:",perfilError);
    }

    if(perfil){

      data.profile = {
        name: perfil.nome,
        image: perfil.imagem
      };

    }

    const { data: produtos, error: produtosError } =
      await db
        .from("produtos")
        .select("*")
        .order("id",{ascending:true});

    if(produtosError){

      console.error("Erro nos produtos:",produtosError);

      document.getElementById("products").innerHTML =
        "<p>Erro ao carregar produtos.</p>";

      return;
    }

    data.products = (produtos || []).map(p => ({

      id:p.id,
      name:p.nome,
      price:p.preco,
      image:p.imagem

    }));

    render();

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      "<p>Não foi possível conectar ao banco.</p>";

  }

}

/* =========================
   MOSTRAR PRODUTOS
========================= */

function render(){

  document.getElementById("profileName").textContent =
    data.profile.name;

  document.getElementById("profileImage").src =
    data.profile.image || "https://via.placeholder.com/150";

  const products =
    document.getElementById("products");

  products.innerHTML="";

  data.products.forEach(p => {

    products.innerHTML += `
      <div class="card">

        <img
          src="${p.image || 'https://via.placeholder.com/400x300'}"
          onerror="this.src='https://via.placeholder.com/400x300'"
        >

        <h3>${p.name}</h3>

        <div class="price">
          ${p.price}
        </div>

        <button
          class="whatsapp"
          onclick="buy('${p.name.replace(/'/g,"\\'")}')"
        >
          WhatsApp
        </button>

      </div>
    `;

  });

}

/* =========================
   WHATSAPP
========================= */

function buy(product){

  const phone="5511994672815";

  const text =
    "Olá! Tenho interesse em: " + product;

  window.open(
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(text),
    "_blank"
  );

}

/* =========================
   LOGIN
========================= */

function login(){

  const senha =
    prompt("Digite a senha do proprietário:");

  if(senha===SENHA){

    document.getElementById("admin").style.display="block";

    document.getElementById("editName").value =
      data.profile.name;

    document.getElementById("editImage").value =
      data.profile.image;

    renderAdmin();

    window.scrollTo({
      top:document.body.scrollHeight,
      behavior:"smooth"
    });

  }else{

    alert("Senha incorreta.");

  }

}

/* =========================
   LOGOUT
========================= */

function logout(){

  document.getElementById("admin").style.display="none";

}

/* =========================
   SALVAR PERFIL
========================= */

async function saveProfile(){

  const nome =
    document.getElementById("editName").value;

  const imagem =
    document.getElementById("editImage").value;

  const { error } =
    await db
      .from("perfil")
      .update({
        nome:nome,
        imagem:imagem
      })
      .eq("id",1);

  if(error){

    console.error(error);

    alert("Erro ao salvar o perfil.");

    return;
  }

  data.profile.name=nome;
  data.profile.image=imagem;

  render();

  alert("Perfil salvo!");

}

/* =========================
   PAINEL DE PRODUTOS
========================= */

function renderAdmin(){

  const area =
    document.getElementById("adminProducts");

  area.innerHTML="";

  data.products.forEach((p,index)=>{

    area.innerHTML += `

      <div class="adminProduct">

        <label>Nome</label>

        <input
          id="name_${index}"
          value="${p.name}"
        >

        <label>Preço</label>

        <input
          id="price_${index}"
          value="${p.price}"
        >

        <label>Foto (URL)</label>

        <input
          id="image_${index}"
          value="${p.image || ''}"
        >

        <button
          class="save"
          onclick="saveProduct(${index})"
        >
          💾 Salvar
        </button>

        <button
          class="delete"
          onclick="deleteProduct(${index})"
        >
          🗑️ Excluir
        </button>

      </div>

    `;

  });

}

/* =========================
   SALVAR PRODUTO
========================= */

async function saveProduct(index){

  const produto = data.products[index];

  const nome =
    document.getElementById("name_"+index).value;

  const preco =
    document.getElementById("price_"+index).value;

  const imagem =
    document.getElementById("image_"+index).value;

  if(produto.id){

    const { error } =
      await db
        .from("produtos")
        .update({
          nome:nome,
          preco:preco,
          imagem:imagem
        })
        .eq("id",produto.id);

    if(error){

      console.error(error);

      alert("Erro ao salvar produto.");

      return;
    }

  }else{

    const { data: novoProduto, error } =
      await db
        .from("produtos")
        .insert({
          nome:nome,
          preco:preco,
          imagem:imagem
        })
        .select()
        .single();

    if(error){

      console.error(error);

      alert("Erro ao adicionar produto.");

      return;
    }

    produto.id = novoProduto.id;

  }

  produto.name=nome;
  produto.price=preco;
  produto.image=imagem;

  render();

  renderAdmin();

  alert("Produto salvo!");

}

/* =========================
   EXCLUIR PRODUTO
========================= */

async function deleteProduct(index){

  const produto =
    data.products[index];

  if(!confirm("Excluir este produto?")){
    return;
  }

  if(produto.id){

    const { error } =
      await db
        .from("produtos")
        .delete()
        .eq("id",produto.id);

    if(error){

      console.error(error);

      alert("Erro ao excluir produto.");

      return;
    }

  }

  data.products.splice(index,1);

  render();

  renderAdmin();

}

/* =========================
   ADICIONAR PRODUTO
========================= */

async function addProduct(){

  const { data: novoProduto, error } =
    await db
      .from("produtos")
      .insert({
        nome:"Novo produto",
        preco:"R$ 0,00",
        imagem:"https://via.placeholder.com/400x300"
      })
      .select()
      .single();

  if(error){

    console.error(error);

    alert("Erro ao adicionar produto.");

    return;
  }

  data.products.push({

    id:novoProduto.id,
    name:novoProduto.nome,
    price:novoProduto.preco,
    image:novoProduto.imagem

  });

  render();

  renderAdmin();

}

/* =========================
   INICIAR APLICATIVO
========================= */

loadData();

</script>

</body>
</html>
